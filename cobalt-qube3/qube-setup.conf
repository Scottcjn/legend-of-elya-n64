# Cobalt Qube 3 setup. Edit this file, then reboot.
# The image reads it on every boot and applies whatever is set.
# Blank or commented lines keep the current setting. Order does not matter.

# Machine name shown on the network and the front LCD.
HOSTNAME=my-qube

# Network. Either:
#   NET=dhcp
# or a static address:  NET=static <ip> <netmask> <gateway>
NET=dhcp
# NET=static 192.168.1.50 255.255.255.0 192.168.1.1

# Root password. Change this away from the default on first boot.
ROOT_PASSWORD=changeme

# RustChain miner wallet name. Leave blank to not mine.
# A real K6 earns the retro-x86 (1.4x antiquity) tier honestly.
RTC_WALLET=

# Optional: an SSH public key added to /root/.ssh/authorized_keys so you can
# log in without a password. Paste the whole one-line key.
SSH_PUBKEY=
